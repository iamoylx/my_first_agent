<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Pet</title>
    <link rel="stylesheet" href="pet.css">
</head>
<body>
    <!-- 桌宠容器（透明背景，可拖拽） -->
    <div class="pet-container" id="pet-container">

        <!-- ===== 控制栏（右上角，始终可见）===== -->
        <div class="pet-controls" id="pet-controls">
            <button class="pet-ctrl-btn pet-ctrl-size" id="btn-pet-smaller" title="缩小">−</button>
            <button class="pet-ctrl-btn pet-ctrl-size" id="btn-pet-bigger" title="放大">＋</button>
            <button class="pet-ctrl-btn pet-ctrl-main" id="btn-back-to-main" title="返回主窗口">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M9 9l6 6M15 9l-6 6"/>
                </svg>
            </button>
            <button class="pet-ctrl-btn pet-ctrl-close" id="btn-close-pet" title="关闭桌宠（退出应用）">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <!-- ===== 角色立绘（6状态精灵图）=====
             素材：素材/状态图/1000148095.png（透明 PNG，3×2 网格）
             布局：
               [待机]     [睡觉]       [按住]
               [左滑]     [右滑]       [回复完成]
             通过 background-position 切换显示区域 -->
        <div class="pet-sprite" id="pet-sprite"></div>

        <!-- ===== 聊天气泡（AI 回复时弹出）=====
             样式参考：素材/对话框/1000148098.png -->
        <div class="chat-bubble" id="chat-bubble">
            <img class="bubble-avatar" id="bubble-avatar" src="assets/avatar.png" alt="小满">
            <div class="bubble-body">
                <p class="bubble-text" id="bubble-text">嗯～我在呢！</p>
            </div>
            <div class="bubble-tail"></div>
            <button class="bubble-close" id="bubble-close" title="关闭气泡">&times;</button>
        </div>

        <!-- ===== 点击提示（首次显示）===== -->
        <div class="click-hint" id="click-hint">点击唤出窗口</div>
    </div>

    <script src="pet.js"></script>
</body>
</html>
